name: Build APK

# Сборка debug-APK и unit-тесты на каждый push и pull request.
# Скачать APK: вкладка Actions → нужный запуск → Artifacts.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Unit-тесты
        run: ./gradlew testDebugUnitTest

      - name: Сборка APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: RussianResale-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
