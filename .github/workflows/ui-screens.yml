name: UI screenshots

# Прогон приложения на эмуляторе Android: тест ScreenshotTour открывает экраны всех ролей
# и снимает скриншоты; схемы draw.io экспортируются в PNG. Результат — в ветке ui-screens.
# Запуск вручную: Actions → UI screenshots → Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Сборка APK и тестов
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # схемы графической части (docs/diagrams/*.drawio) экспортируются в PNG самим draw.io Desktop
      - name: Экспорт схем draw.io в PNG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R jgraph/drawio-desktop -p 'drawio-amd64-*.deb' -D /tmp/drawio
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb /tmp/drawio/*.deb
          mkdir -p diagrams-png
          for f in docs/diagrams/*.drawio; do
            n=$(basename "$f" .drawio)
            xvfb-run -a drawio --export --format png --scale 2 --border 16 --output "diagrams-png/$n.png" "$f" --no-sandbox --disable-gpu || true
          done
          ls -la diagrams-png

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Скриншоты на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.russianresale.app.ScreenshotTour com.russianresale.app.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt 2>&1 || true
            adb exec-out run-as com.russianresale.app tar -cf - -C files screens > screens.tar

      - name: Выложить скриншоты в ветку ui-screens
        if: always()
        run: |
          mkdir -p out
          tar -xf screens.tar -C out || true
          cp instrument.txt out/ 2>/dev/null || true
          cp -r diagrams-png out/diagrams 2>/dev/null || true
          cd out
          git init -q -b ui-screens
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "UI screenshots ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ui-screens
